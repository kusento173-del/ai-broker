<!doctype html>
<html lang="zh-CN">
<head>

  <style>
    :root {

      --panel: rgba(8, 18, 34, .74);
      --panel-strong: rgba(10, 28, 52, .88);
      --line: rgba(162, 219, 255, .18);
      --line-strong: rgba(54, 220, 255, .42);
      --text: #edf7ff;
      --muted: #9bb2c9;
      --cyan: #28e4ff;
      --green: #25d9a2;
      --orange: #ff9b4a;
      --red: #ff5e7a;
      --violet: #a78bff;
      --yellow: #ffe66d;
      --radius: 8px;
      --shadow: 0 28px 90px rgba(0, 0, 0, .46);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
    body {
      background:

        linear-gradient(245deg, rgba(255, 155, 74, .10), transparent 25%),
        linear-gradient(180deg, #020611 0%, #08172b 52%, #030914 100%);

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background-image:

      mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .46;

    #fx {

      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      opacity: .78;
    }
    .deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    .slide {
      position: absolute;
      inset: 0;
      display: none;
      padding: 5vh 5.4vw 5.2vh;
      overflow: hidden;
    }
    .slide[data-chapter="0"] { background: radial-gradient(circle at 78% 20%, rgba(40,228,255,.12), transparent 28%); }
    .slide[data-chapter="1"] { background: radial-gradient(circle at 16% 78%, rgba(255,94,122,.10), transparent 30%); }
    .slide[data-chapter="2"] { background: radial-gradient(circle at 78% 78%, rgba(37,217,162,.12), transparent 28%); }
    .slide[data-chapter="3"] { background: radial-gradient(circle at 16% 20%, rgba(167,139,255,.12), transparent 30%); }
    .slide[data-chapter="4"] { background: radial-gradient(circle at 78% 18%, rgba(255,155,74,.13), transparent 30%); }
    .slide[data-chapter="5"] { background: radial-gradient(circle at 50% 88%, rgba(255,230,109,.10), transparent 34%); }
    .slide.active {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 2.2vh;
      animation: enter .46s ease both;
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(14px) scale(.992); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .slide::before {
      content: attr(data-watermark);
      position: absolute;
      right: -2vw;
      bottom: 3vh;
      font-size: clamp(80px, 11vw, 190px);
      font-weight: 950;
      color: rgba(255, 255, 255, .035);
      letter-spacing: 0;
      pointer-events: none;
      white-space: nowrap;
    }
    .slide::after {
      content: "";
      position: absolute;
      inset: 26px;
      border: 1px solid rgba(162, 219, 255, .12);
      border-radius: 16px;
      pointer-events: none;
      box-shadow: inset 0 0 44px rgba(40,228,255,.05);
    }
    .scan {
      position: absolute;
      left: 0;
      right: 0;
      height: 34vh;
      top: -34vh;
      background: linear-gradient(180deg, transparent, rgba(40, 228, 255, .12), transparent);
      animation: scan 7s linear infinite;
      pointer-events: none;
    }
    @keyframes scan { to { transform: translateY(134vh); } }
    .slide > header, .content, .footer { position: relative; z-index: 2; }
    header {

      gap: 12px;
      max-width: 1220px;
      padding-left: 18px;
      border-left: 4px solid rgba(40, 228, 255, .72);
    }
    .kicker {
      color: var(--green);
      font-size: clamp(13px, .9vw, 17px);
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;

    h1, h2, h3, p { margin: 0; }
    h1 {

      line-height: 1.02;
      letter-spacing: 0;
      color: #fff;
    }
    h2 {
      font-size: clamp(31px, 3.35vw, 58px);
      line-height: 1.13;
      color: #fff;
      letter-spacing: 0;
    }
    h3 {
      font-size: clamp(19px, 1.45vw, 28px);
      line-height: 1.28;
      letter-spacing: 0;
    }
    p, li, td, th {
      color: var(--muted);
      font-size: clamp(15px, 1.02vw, 20px);
      line-height: 1.62;
    }
    b, strong { color: #fff; }
    .lead {
      color: #dceeff;
      font-size: clamp(20px, 1.65vw, 31px);
      line-height: 1.48;
    }
    .content { min-height: 0; display: grid; align-items: center; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: center; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-items: stretch; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: stretch; }
    .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; align-items: stretch; }
    .grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-items: stretch; }
    .panel, .metric, .terminal, .boss, .quote, .wechat, .media-card {

      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .panel {
      padding: 22px;
      position: relative;
      overflow: hidden;
      min-height: 130px;
    }
    .panel::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--green), transparent);

    .panel strong {

      margin-bottom: 10px;
      color: #fff;
      font-size: clamp(18px, 1.25vw, 24px);
    }
    .metric {
      padding: 22px;
      background: linear-gradient(180deg, rgba(40, 228, 255, .16), rgba(255,255,255,.055));

    }
    .num {
      display: block;
      color: #fff;
      font-weight: 950;
      font-size: clamp(38px, 3.8vw, 72px);
      line-height: .98;
      letter-spacing: 0;
    }
    .label {
      display: block;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.45;
      font-size: clamp(14px, .95vw, 18px);
    }
    .boss {
      padding: 18px 20px;
      border-color: rgba(255, 230, 109, .34);
      background: linear-gradient(90deg, rgba(255, 230, 109, .12), rgba(255, 155, 74, .08));

      font-weight: 900;
      font-size: clamp(17px, 1.18vw, 23px);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .boss::before {
      content: "";
      width: 10px;
      height: 38px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--yellow), var(--orange));
      box-shadow: 0 0 22px rgba(255, 230, 109, .32);
      flex: 0 0 auto;
    }
    .quote {
      padding: 24px 26px;
      border-left: 5px solid var(--green);
      color: #fff;
      font-size: clamp(24px, 2vw, 38px);
      line-height: 1.46;
    }
    .terminal {
      padding: 20px;
      background: rgba(1, 6, 14, .88);
      color: #dff8ff;
      font: 15px/1.58 Consolas, "Courier New", monospace;
      white-space: pre-wrap;
      max-height: 64vh;
      overflow: hidden;
    }
    .terminal .ok { color: var(--green); }
    .terminal .warn { color: var(--orange); }
    .terminal .err { color: var(--red); }
    .flow {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }
    .step {
      min-height: 140px;
      padding: 16px;
      border: 1px solid rgba(40, 228, 255, .28);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(40, 228, 255, .12), rgba(255,255,255,.04));
      position: relative;
      overflow: hidden;
    }
    .step::before {
      content: attr(data-step);
      display: inline-flex;
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--green);
      color: #01131c;
      font-weight: 950;
      margin-bottom: 12px;
    }
    .step::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--green), var(--orange));
      animation: pulseLine 2.2s ease infinite;
    }
    @keyframes pulseLine { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    .step b { display: block; margin-bottom: 8px; color: #fff; font-size: 18px; }
    .step small { color: var(--muted); line-height: 1.45; }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: var(--radius);
      background: rgba(4, 16, 30, .78);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    th, td {
      padding: 13px 14px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      text-align: left;
      color: var(--text);
      vertical-align: top;
    }
    th {
      color: #d7fbff;
      background: rgba(40, 228, 255, .14);
      font-weight: 900;
    }
    .pill-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .pill {
      border: 1px solid rgba(40, 228, 255, .34);
      border-radius: 999px;
      background: rgba(40, 228, 255, .10);
      color: #dffaff;
      padding: 8px 12px;
      font-weight: 900;
      font-size: 14px;
    }
    .pill.hot { border-color: rgba(255, 155, 74, .42); background: rgba(255, 155, 74, .12); color: #ffe8d4; }
    .pill.risk { border-color: rgba(255, 94, 122, .42); background: rgba(255, 94, 122, .12); color: #ffdce3; }
    .image-wall {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 17vh;
      gap: 10px;
    }
    .image-wall img, .screen, .video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: var(--shadow);
      background: #000;
    }
    .screen { height: min(58vh, 520px); }
    .video { height: min(58vh, 520px); }
    .media-card { padding: 12px; background: rgba(4, 16, 30, .84); }
    .media-caption { padding: 12px 6px 2px; color: var(--muted); }
    .radar {
      height: 52vh;
      min-height: 420px;
      border: 1px solid rgba(40,228,255,.28);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at center, transparent 0 14%, rgba(40,228,255,.12) 15%, transparent 16% 31%, rgba(40,228,255,.10) 32%, transparent 33% 48%, rgba(40,228,255,.08) 49%, transparent 50%),
        conic-gradient(from 0deg, rgba(37,217,162,.38), transparent 24%, rgba(40,228,255,.18), transparent 64%, rgba(255,155,74,.28));
      position: relative;
      overflow: hidden;
    }
    .radar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: conic-gradient(from 0deg, rgba(37,217,162,.55), transparent 16%, transparent);
      animation: rotate 7s linear infinite;
      transform-origin: center;
      mix-blend-mode: screen;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .radar span {
      position: absolute;
      z-index: 2;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(3,13,25,.78);
      border-radius: 999px;
      padding: 9px 12px;
      color: #fff;
      font-weight: 900;
      white-space: nowrap;
    }
    .axis {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 12px;
      align-items: center;
      margin: 13px 0;
    }
    .bar {
      height: 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
    }

      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--red), var(--orange), var(--green));

      color: #142334;

    .event {

      gap: 16px;
      align-items: stretch;

    .chapter-title {

    .chapter-list {
      margin-top: 28px;

      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }
    .chapter-bar {
      position: fixed;
      left: 5.4vw;
      right: 5.4vw;

      gap: 8px;

      pointer-events: none;

    .chapter-dot {

    .chapter-dot.active { background: linear-gradient(90deg, var(--cyan), var(--green)); }
    .nav {

      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(255,255,255,.08);
      z-index: 40;
    }
    .progress div {

      width: 0;

    .notes {

      left: 5.4vw;

    body.show-notes .slide.active { padding-bottom: 15vh; }
    .subtle {
      color: rgba(237,247,255,.72);
      font-size: 14px;
    }
    .slide.active .panel,
    .slide.active .metric,
    .slide.active .terminal,
    .slide.active .quote,
    .slide.active .boss,
    .slide.active table,
    .slide.active .media-card {
      animation: rise .48s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 980px) {
      .slide { padding: 5vh 4.6vw; }
      .slide.active { overflow-y: auto; }
      .grid2, .grid3, .grid4, .grid5, .grid6, .flow, .chapter-list { grid-template-columns: 1fr; }
      .image-wall { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 22vh; }
      .event { grid-template-columns: 1fr; }
      .chapter-bar { left: 4.6vw; right: 4.6vw; }
      .nav { display: none; }
    }
  </style>
</head>

    const deck = document.getElementById("deck");
    const notes = document.getElementById("notes");
    const bar = document.getElementById("bar");
    const chapterBar = document.getElementById("chapterBar");

    chapterBar.innerHTML = chapters.map((name, index) => `<div class="chapter-dot" title="${name}" data-chapter="${index}"></div>`).join("");

    function renderSlide(slide, index) {
      const section = document.createElement("section");
      section.className = `slide ${slide.kind === "title" ? "title-slide" : ""} ${slide.kind === "chapter" ? "chapter-slide" : ""}`;
      section.dataset.index = index;
      section.dataset.chapter = slide.chapter;
      section.dataset.watermark = String(index + 1).padStart(2, "0");
      const header = slide.kind === "title" || slide.kind === "chapter"
        ? ""
        : `<header><div class="kicker">${slide.kicker}</div><h2>${slide.title}</h2></header>`;
      const titleBody = slide.kind === "title" || slide.kind === "chapter"
        ? `<div class="chapter-title"><div class="kicker">${slide.kicker}</div><h1>${slide.title}</h1>${slide.html || ""}</div>`
        : `<div class="content">${slide.html || ""}${slide.boss ? `<div class="boss" style="margin-top:22px">${slide.boss}</div>` : ""}</div>`;
      section.innerHTML = `<div class="scan"></div>${header}${titleBody}<footer class="footer"><span>${chapters[slide.chapter]}</span><span class="page"></span></footer>`;
      deck.appendChild(section);
    }

    slides.forEach(renderSlide);
    const sections = [...document.querySelectorAll(".slide")];
    let current = 0;

    function update() {
      sections.forEach((section, index) => {
        const active = index === current;
        section.classList.toggle("active", active);
        const page = section.querySelector(".page");
        if (page) page.textContent = `${String(index + 1).padStart(2, "0")} / ${sections.length}`;
      });
      document.querySelectorAll(".chapter-dot").forEach(dot => {
        dot.classList.toggle("active", Number(dot.dataset.chapter) === slides[current].chapter);
      });
      notes.textContent = slides[current].note || "";
      bar.style.width = `${((current + 1) / sections.length) * 100}%`;
      document.title = `AI 经纪人项目展示 长版大屏 ${current + 1}/${sections.length}`;
    }

    function go(delta) {
      current = Math.max(0, Math.min(sections.length - 1, current + delta));
      update();
    }

    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("next").onclick = () => go(1);
    document.addEventListener("keydown", event => {
      if (["ArrowRight", "PageDown", " "].includes(event.key)) { event.preventDefault(); go(1); }
      if (["ArrowLeft", "PageUp"].includes(event.key)) { event.preventDefault(); go(-1); }
      if (event.key === "Home") { current = 0; update(); }
      if (event.key === "End") { current = sections.length - 1; update(); }
      if (event.key.toLowerCase() === "n") document.body.classList.toggle("show-notes");
    });

    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    let points = [];
    function resize() {
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      const count = Math.min(88, Math.max(42, Math.floor(window.innerWidth / 22)));
      points = Array.from({ length: count }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - .5) * .32,
        vy: (Math.random() - .5) * .32,
        r: Math.random() * 1.7 + .5
      }));
    }
    function draw() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.lineWidth = 1;
      for (const p of points) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -20) p.x = window.innerWidth + 20;
        if (p.x > window.innerWidth + 20) p.x = -20;
        if (p.y < -20) p.y = window.innerHeight + 20;
        if (p.y > window.innerHeight + 20) p.y = -20;
      }
      for (let i = 0; i < points.length; i++) {
        const a = points[i];
        ctx.beginPath();
        ctx.fillStyle = "rgba(40, 228, 255, .62)";
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fill();
        for (let j = i + 1; j < points.length; j++) {
          const b = points[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < 135) {
            ctx.strokeStyle = `rgba(40, 228, 255, ${(1 - distance / 135) * .16})`;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(draw);
    }
    window.addEventListener("resize", resize);
    resize();
    draw();
    update();
  </script>
